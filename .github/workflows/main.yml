name: CI & Container Publish

# A GitHub Actions workflow for building, testing, and publishing a Node.js bot as a container image.
# Notes:
# - GitHub Actions runners are ephemeral and are not suitable for running a process 24/7.
# - To run the bot continuously, deploy the built container to a hosting provider (e.g. Render, Railway, Heroku, AWS ECS, DigitalOcean App Platform) or run it on a self-hosted machine.
# - This workflow builds, tests, and publishes a Docker image to GitHub Container Registry (GHCR) on pushes to the default branch.

on:
  push:
    branches: [ 'main', 'master' ]
  workflow_dispatch:
  schedule:
    # Run every 6 hours (uncomment if you'd like scheduled builds)
    - cron: '0 */6 * * *'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps

      - name: Lint (if available)
        run: |
          if npm run | grep -q "lint"; then npm run lint; else echo "No lint script"; fi

      - name: Run tests (if available)
        run: |
          if npm run | grep -q "test"; then npm test --if-present || true; else echo "No test script"; fi

      - name: Build (if available)
        run: |
          if npm run | grep -q "build"; then npm run build || true; else echo "No build script"; fi

      - name: Upload build artifact (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-artifact
          path: |
            node_modules
            .

  publish-container:
    name: Build & Publish container to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
  ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | lower }}:latest
  ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | lower }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image details
        run: |
          echo "Image published: ghcr.io/${{ github.repository }}:latest"

  notes:
    name: Notes about 24/7 running
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Advice
        run: |
          echo "GitHub Actions runners are not intended for 24/7 processes. To keep your bot running 24/7, deploy the container to a hosting service (Render, Railway, Fly.io, Heroku, AWS, DigitalOcean) or run it on a self-hosted machine. See README for deployment instructions."