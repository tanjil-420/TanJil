name: Run Bot Service

on:
  push:
    branches: [ 'main', 'master' ]
  workflow_dispatch:

jobs:
  run-bot:
    name: Start Bot Process
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci --legacy-peer-deps || npm install

      - name: Start Bot
        run: |
          node index.js
